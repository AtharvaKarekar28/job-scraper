name: Scrape jobs

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit results
        run: |
          git config user.name  "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json data/seen.json
          if git diff --staged --quiet; then
            echo "No change in results today."
          else
            git commit -m "Jobs refreshed $(date -u '+%Y-%m-%d')"
            git push
          fi
